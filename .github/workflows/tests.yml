name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate marketplace catalog
        run: sh scripts/validate.sh

  plugins:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install lsof (Linux)
        if: runner.os == 'Linux'
        run: command -v lsof || (sudo apt-get update && sudo apt-get install -y lsof)
      - name: Run tests of every plugin that has them
        run: |
          set -e
          for dir in plugins/*/; do
            if [ -d "$dir/tests" ]; then
              echo "::group::$dir"
              (cd "$dir" && python -m unittest discover -s tests -v)
              echo "::endgroup::"
            fi
          done
